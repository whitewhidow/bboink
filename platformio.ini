board_build.partitions = partitions.csv
build_src_filter =
    +<*>
    -<web/webui.cpp>
    -<app/screen_connect.cpp>
    -<app/screen_configap.cpp>
board_build.filesystem = littlefs
monitor_speed = 115200
; C5 native-USB flashing needs a slow speed + --no-stub.
upload_speed = 115200
upload_flags = --no-stub

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    ; Board selector + compat-shim include path (<M5Unified.h>/<M5Cardputer.h>)
    -DPORK_BOARD_TDISPLAY_C5
    -I src/hal/tembed_shims
    ; NimBLE: internal alloc (PSRAM disabled), low log verbosity
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Deauth raw-frame override — verified working on the C5 with wsl_bypasser.
    -DOINK_DEAUTH_OVERRIDE
    ; Required: wsl_bypasser overrides ieee80211_raw_frame_sanity_check.
    -Wl,-zmuldefs
    -Os

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^2.3.7

