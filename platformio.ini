; ---------------------------------------------------------------------------
; M5Cardputer ADV (ESP32-S3, StampS3, ~8MB flash). Brought up like the Waveshare
; SINGLE-BUTTON profile: LovyanGFX + tembed_shims (NO M5Unified/M5Cardputer libs),
; on-device menu screens excluded, management over the BLE console. Only the top
; "G0" button (GPIO0) is read — the ADV's TCA8418 keyboard is ignored for v1.
; Display/SD pins from M5GFX board_M5CardputerADV autodetect (see board.h +
; hal/cardputer_adv_lgfx.h). UNVERIFIED until first hardware bring-up; flash size
; assumes 8MB (StampS3) — bump flash_size + partitions if your ADV variant is 16MB.
; REMAINING WIRING (not code-complete): m5compat.cpp needs a CARDPUTER_ADV backend
; (instantiate LGFX_CardputerADV + a GPIO0 single-button input feeding porkhal::vkey
; + a no-PMU PowerFacade stub), mirroring the Waveshare backend.
; ---------------------------------------------------------------------------
[env:cardputer-adv]
platform = espressif32@6.12.0
board = m5stack-stamps3   # the Cardputer/ADV is a StampS3 — using esp32-s3-devkitc-1 bootloops before setup()
framework = arduino
custom_version = 0.1.0-oink
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions-cardputer-adv.csv
board_build.sdkconfig = sdkconfig.defaults
build_src_filter =
    +<*>
    -<web/webui.cpp>
    -<app/screen_menu.cpp>
    -<app/screen_manage.cpp>
    -<app/screen_ohc.cpp>
    -<app/screen_pwncrack.cpp>
    -<app/screen_options.cpp>
    -<app/screen_configap.cpp>
    -<app/screen_connect.cpp>
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    ; Board selector + compat-shim include path (<M5Unified.h>/<M5Cardputer.h>)
    -DPORK_BOARD_CARDPUTER_ADV
    -I src/hal/tembed_shims
    ; NimBLE: internal alloc (PSRAM disabled), low log verbosity
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Deauth raw-frame override — S3 path, same as the T-Embed.
    -DOINK_DEAUTH_OVERRIDE
    -Wl,-zmuldefs
    -Os

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^2.3.7
