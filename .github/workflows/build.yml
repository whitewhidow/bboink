name: build

# Builds BBoink for every supported board and produces, per board:
#   bboink-<env>.bin      merged single image, full flash at 0x0 (esptool)
#   bboink-app-<env>.bin  app-only image (SD-launcher / in-app self-updater)
# Runs ONLY on a version tag (v*) — cuts a Release with all bins attached and
# publishes the merged bins into flasher/. Pushes to main do NOT trigger a build;
# use the manual "Run workflow" (workflow_dispatch) for a one-off build if needed.

on:
  push:
    tags: [ 'v*' ]        # ONLY build/release on version tags — pushes to main do NOT build
  workflow_dispatch:      # manual one-off build when you want one without tagging

permissions:
  contents: write   # release step uploads the .bins

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: t-embed-cc1101   # LilyGo T-Embed CC1101 / PLUS (ESP32-S3)
            chip: esp32s3
            flash_size: 16MB
            boot: "0x0"
          - env: tdisplay-c5      # LilyGo T-Display C5 (ESP32-C5)
            chip: esp32c5
            flash_size: 16MB
            boot: "0x2000"
          - env: waveshare-c5-lcd # Waveshare ESP32-C5-LCD-1.47
            chip: esp32c5
            flash_size: 4MB
            boot: "0x2000"
          - env: cardputer-adv    # M5Cardputer ADV (StampS3, ESP32-S3, 8MB)
            chip: esp32s3
            flash_size: 8MB
            boot: "0x0"
          - env: tdongle-s3       # LilyGo T-Dongle S3 (ESP32-S3, 16MB)
            chip: esp32s3
            flash_size: 16MB
            boot: "0x0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Install PlatformIO + esptool
        run: pip install --upgrade platformio "esptool==5.1.0"   # 5.x knows esp32c5

      - name: Build firmware (${{ matrix.env }})
        run: |
          # pioarduino's ESP32-C5 platform occasionally resolves FRAMEWORK_DIR=None on
          # a cold cache — retry a couple of times.
          for i in 1 2 3; do
            pio run -e ${{ matrix.env }} && exit 0
            echo "::warning::build attempt $i for ${{ matrix.env }} failed, retrying"; sleep 4
          done
          exit 1

      - name: Package bins (${{ matrix.env }})
        run: |
          B=.pio/build/${{ matrix.env }}
          BA=$(find ~/.platformio/packages -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)
          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o bboink-${{ matrix.env }}.bin \
            --flash_mode dio --flash_size ${{ matrix.flash_size }} \
            ${{ matrix.boot }} "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BA" \
            0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" bboink-app-${{ matrix.env }}.bin

      - name: Upload build artifacts (${{ matrix.env }})
        uses: actions/upload-artifact@v4
        with:
          name: bboink-bins-${{ matrix.env }}
          path: |
            bboink-${{ matrix.env }}.bin
            bboink-app-${{ matrix.env }}.bin

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bboink-${{ matrix.env }}.bin
            bboink-app-${{ matrix.env }}.bin

  # On a release tag, publish the merged bins into flasher/fw/<tag>/ on main so the
  # GitHub-Pages web flasher (whitewhidow.github.io/bboink/flasher/) can serve them
  # same-origin (release assets have no CORS). Keeps only the latest 2 versions.
  publish-flasher:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download this build's board bins
        uses: actions/download-artifact@v4
        with:
          pattern: bboink-bins-*
          path: _bins
          merge-multiple: true

      - name: Stage bins + regenerate versions.json (keep latest 2)
        run: |
          set -e
          VER="${GITHUB_REF_NAME}"
          mkdir -p "flasher/fw/$VER"
          for env in t-embed-cc1101 tdisplay-c5 waveshare-c5-lcd cardputer-adv tdongle-s3; do
            cp "_bins/bboink-$env.bin" "flasher/fw/$VER/bboink-$env.bin"
          done
          rm -rf _bins
          # prune to the two newest version dirs
          keep=$(ls -d flasher/fw/v* | xargs -n1 basename | sort -V | tail -2)
          for d in flasher/fw/v*; do
            b=$(basename "$d")
            echo "$keep" | grep -qx "$b" || { echo "prune $b"; rm -rf "$d"; }
          done
          vers=$(ls -d flasher/fw/v* | xargs -n1 basename | sort -Vr | jq -R . | jq -s .)
          jq -n --argjson versions "$vers" '{
            boards: [
              {env:"t-embed-cc1101",   name:"LilyGo T-Embed CC1101 / PLUS", chipFamily:"ESP32-S3"},
              {env:"tdisplay-c5",      name:"LilyGo T-Display C5",           chipFamily:"ESP32-C5"},
              {env:"waveshare-c5-lcd", name:"Waveshare ESP32-C5-LCD-1.47",   chipFamily:"ESP32-C5"},
              {env:"cardputer-adv",    name:"M5Cardputer ADV",               chipFamily:"ESP32-S3"},
              {env:"tdongle-s3",       name:"LilyGo T-Dongle S3",            chipFamily:"ESP32-S3"}
            ],
            versions: $versions
          }' > flasher/versions.json
          cat flasher/versions.json

      - name: Commit to main
        run: |
          git config user.name  whitewhidow
          git config user.email contact@branchbit.be
          git add flasher/fw flasher/versions.json
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "flasher: publish ${GITHUB_REF_NAME} bins (keep latest 2)"
          git push origin HEAD:main
